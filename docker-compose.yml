services:
  ollama:
    image: ollama/ollama:latest
    container_name: fablab-ollama
    restart: unless-stopped
    # Aucun port publie sur l'hote : accessible uniquement via le reseau
    # Docker interne (les autres services y accedent par le nom "ollama").
    volumes:
      - ollama_:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  chromadb:
    image: chromadb/chroma:latest
    container_name: fablab-chromadb
    restart: unless-stopped
    # Aucun port publie sur l'hote : accessible uniquement via le reseau
    # Docker interne (les autres services y accedent par le nom "chromadb").
    volumes:
      - chroma_:/chroma/chroma
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - ": > /dev/tcp/127.0.0.1/8000"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: fablab-redis
    restart: unless-stopped
    # Aucun port publie sur l'hote : accessible uniquement via le reseau
    # Docker interne (les autres services y accedent par le nom "redis").
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: fablab-backend
    restart: unless-stopped
    ports:
      - "${SERVER_BIND_HOST:-0.0.0.0}:${PORT:-3000}:${PORT:-3000}"
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${PROJECT_WORKSPACE_DIR:-.}/backend/uploads:/app/uploads
      - ${PROJECT_WORKSPACE_DIR:-.}/backend/logs:/app/logs
      - ${PROJECT_WORKSPACE_DIR:-.}/backend/data:/app/data
      # Monte en lecture seule : la version affichee reste toujours celle reelle
      # de version.json sur l'hote, meme sans reconstruire l'image (celle-ci
      # n'etait sinon mise a jour qu'au prochain build, pouvant afficher un
      # numero perime apres un export/publication sans reconstruction).
      - ${PROJECT_WORKSPACE_DIR:-.}/version.json:/app/version.json:ro
      - ${PROJECT_WORKSPACE_DIR:-.}/update.config.json:/app/update.config.json:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PORT:-3000}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    profiles:
      - frontend-dev
    build:
      context: ./frontend
    container_name: fablab-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_DEV_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env

  updater:
    build:
      context: ./updater
    container_name: fablab-updater
    restart: unless-stopped
    volumes:
      - ${PROJECT_WORKSPACE_DIR:-.}/:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      UPDATE_WORKSPACE_DIR: /workspace
      UPDATE_CONFIG_PATH: /workspace/update.config.json
      VERSION_FILE_PATH: /workspace/version.json
      UPDATE_PORT: 3010
      UPDATE_PROJECT_NAME: fablab-ai
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3010/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  ollama_:
  chroma_:
