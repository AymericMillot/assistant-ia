name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Nom de base des archives de release. Doit rester aligne avec
  # PACKAGE_BASENAME de export.sh et packageFileTemplate de update.config.json.
  # Indispensable ici : actions/checkout extrait le depot dans un dossier
  # portant le nom du depot, donc sans cette variable export.sh nommerait
  # l'archive d'apres ce nom.
  UPDATE_PROJECT_NAME: assistant-ia

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Epingle sur le SHA de commit (v4.2.2) : un tag mutable peut etre
      # repointe silencieusement par le proprietaire de l'action (attaque
      # chaine d'approvisionnement). Mettre a jour ce SHA volontairement.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./version.json').version")"
          test "$tag" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release archives
        run: ./export.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          folder="export/$version"
          base="${UPDATE_PROJECT_NAME}-v$version"

          test -f "$folder/$base.tar.gz" || { echo "Archive introuvable : $folder/$base.tar.gz" >&2; ls -la "$folder" >&2; exit 1; }
          test -f "$folder/$base.zip"    || { echo "Archive introuvable : $folder/$base.zip"    >&2; ls -la "$folder" >&2; exit 1; }

          sha_targz="$(sha256sum "$folder/$base.tar.gz" | awk '{print $1}')"
          sha_zip="$(sha256sum "$folder/$base.zip" | awk '{print $1}')"

          # Le SHA-256 de l'archive est publie DANS le corps de la release
          # (pas en asset separe) : le service de mise a jour le lit via l'API
          # GitHub et refuse toute archive dont l'empreinte differe.
          notes_file="$(mktemp)"
          cat release-notes.txt > "$notes_file"
          {
            echo
            echo "---"
            echo "Vérification d'intégrité :"
            echo '```'
            echo "sha256 (${base}.tar.gz): ${sha_targz}"
            echo "sha256 (${base}.zip): ${sha_zip}"
            echo '```'
          } >> "$notes_file"

          # Assets = uniquement le code source (.tar.gz et .zip).
          # Titre de la release = le tag lui-meme (vX.X.X).
          # Une version "X.Y.Z-beta.N" est marquee prerelease GitHub : exclue
          # par defaut du canal stable cote updater (voir includeBeta).
          prerelease_flag=()
          if [[ "$version" == *-beta.* ]]; then
            prerelease_flag=(--prerelease)
          fi

          gh release create "v$version" \
            "$folder/$base.tar.gz#Code source (v$version, .tar.gz)" \
            "$folder/$base.zip#Code source (v$version, .zip)" \
            --title "v$version" --notes-file "$notes_file" "${prerelease_flag[@]}"
