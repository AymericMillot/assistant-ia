name: Sync main with release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main

      - name: Get release tag and version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ github.event.release.tag_name }}"
          version_number="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_number=$version_number" >> "$GITHUB_OUTPUT"

      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.release.outputs.version }}"
          version_number="${{ steps.release.outputs.version_number }}"
          gh release download "$version" \
            -p "assistant-ia-v$version_number.tar.gz" \
            -D /tmp/release

      - name: Extract and sync files
        run: |
          version_number="${{ steps.release.outputs.version_number }}"
          cd /tmp/release
          tar xzf assistant-ia-v$version_number.tar.gz

          # Trouver le dossier extrait (peut être assistant-ia-vX.X.X ou assistant-ia)
          extracted_dir=$(find . -maxdepth 1 -type d -name "assistant-ia*" | head -1)
          if [ -z "$extracted_dir" ]; then
            extracted_dir="."
          fi

          # Copier tous les fichiers sauf les données locales
          cd "$extracted_dir"
          for item in *; do
            case "$item" in
              backend/data|backend/uploads|backend/logs|.env|.env.*|.git|.update-backups|*.txt|.claude|export)
                # Ne pas synchroniser les données locales
                ;;
              *)
                if [ -e "/github/workspace/$item" ]; then
                  rm -rf "/github/workspace/$item"
                fi
                cp -r "$item" "/github/workspace/"
                ;;
            esac
          done

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchroniser main avec la release ${{ steps.release.outputs.version }}"
          git push origin main
